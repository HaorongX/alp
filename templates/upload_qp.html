<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Question Paper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
      color: #2c3e50;
    }

    .hero {
      text-align: center;
      margin: 50px 0 40px;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 700;
    }

    .upload-area {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }

    .upload-area input[type="file"] {
      display: none;
    }

    .custom-file-label {
      display: inline-block;
      padding: 12px 28px;
      font-size: 1rem;
      background-color: #0d6efd;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .custom-file-label:hover {
      background-color: #0b5ed7;
    }

    #status {
      margin-top: 20px;
      color: #6c757d;
      font-style: italic;
    }

    .results {
      margin-top: 50px;
    }

    .image-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.15s ease;
    }

    .image-card:hover {
      transform: translateY(-3px);
    }

    .image-card img {
      border-radius: 12px 12px 0 0;
      width: 100%;
      height: auto;
    }

    .footer {
      text-align: center;
      color: #adb5bd;
      font-size: 0.9rem;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="hero">
      <h1>📤 Upload Question Paper</h1>
      <p class="text-muted">Upload a PDF to process and view extracted questions</p>
    </div>

    <div class="upload-area">
      <form id="uploadForm" enctype="multipart/form-data">
        <label for="pdfFile" class="custom-file-label">Upload a .zip file of one QP and MS</label>
        <input type="file" id="pdfFile" name="pdf" accept="application/zip" required>
        <div id="status"></div>
      </form>
    </div>

    <div class="results">
      <div id="imagesContainer" class="row g-4 mt-4">
        {% if images %}
          {% for item in images %}
          <div class="col-md-4 col-lg-3">
            <div class="card image-card">
              <img src="data:image/png;base64,{{ item.image }}" alt="Processed image">
              <div class="card-body text-center">
                <small class="text-muted">ID: {{ item.id }}</small>
              </div>
            </div>
          </div>
          {% endfor %}
        {% endif %}
      </div>
    </div>

    <div class="footer">
      <p>&copy; {{ current_year }} Test Maker</p>
    </div>
  </div>

  <script>
    document.getElementById('pdfFile').addEventListener('change', async function() {
      const fileInput = this;
      const status = document.getElementById('status');
      const container = document.getElementById('imagesContainer');

      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('zip', fileInput.files[0]);

      status.textContent = '⏳ Processing... Sit and relax';
      container.innerHTML = '';

      try {
        const response = await fetch('{{ url_for("upload.upload_pdf") }}', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Server error');

        const result = await response.json();
        status.textContent = '✅ Complete';

        // Clear and render new images
        container.innerHTML = '';
        result.data.forEach(item => {
          const col = document.createElement('div');
          col.className = 'col-md-4 col-lg-3';
          col.innerHTML = `
            <div class="card image-card">
              <img src="data:image/png;base64,${item.image}" alt="Processed image">
              <div class="card-body text-center">
                <small class="text-muted">ID: ${item.id}</small>
              </div>
            </div>
          `;
          container.appendChild(col);
        });

      } catch (err) {
        status.textContent = '❌ Error processing file. Please try again.';
        console.error(err);
      }
    });
  </script>

</body>
</html>
